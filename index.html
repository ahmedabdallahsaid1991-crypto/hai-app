<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20192%20192%22%3E%0A%3Crect%20width%3D%22192%22%20height%3D%22192%22%20rx%3D%2236%22%20fill%3D%22%231F4E5F%22/%3E%0A%3Crect%20x%3D%2240%22%20y%3D%2284%22%20width%3D%22112%22%20height%3D%2224%22%20rx%3D%226%22%20fill%3D%22%23EAF4F6%22/%3E%0A%3Crect%20x%3D%2284%22%20y%3D%2240%22%20width%3D%2224%22%20height%3D%22112%22%20rx%3D%226%22%20fill%3D%22%23EAF4F6%22/%3E%0A%3Ccircle%20cx%3D%2296%22%20cy%3D%2296%22%20r%3D%2284%22%20fill%3D%22none%22%20stroke%3D%22%237FD8C4%22%20stroke-width%3D%226%22/%3E%0A%3C/svg%3E">

<style>
  :root{
    --navy:#1F4E5F;
    --navy-deep:#163942;
    --teal:#2E7D8C;
    --teal-light:#EAF4F6;
    --cream:#F7F5F0;
    --ink:#1C2B30;
    --muted:#6b7c80;
    --alert:#C6512E;
    --alert-bg:#FBE6DE;
    --good:#3F7A56;
    --good-bg:#E3F0E7;
    --amber:#B8860B;
    --amber-bg:#FBF2DA;
    --border:#DFE5E3;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Segoe UI','Tajawal','Cairo',Tahoma,Arial,sans-serif;
    font-size:14.5px;
    line-height:1.6;
  }
  ::selection{background:var(--teal-light);}
  .app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px; flex:0 0 230px;
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    padding:22px 18px 16px 18px; border-bottom:1px solid rgba(255,255,255,.12);
  }
  .brand .title{font-size:16px; font-weight:700; letter-spacing:.2px;}
  .brand .sub{font-size:11px; color:#B9CDD2; margin-top:4px;}
  .nav{flex:1; padding:10px 0;}
  .nav button{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:right; background:transparent; border:none;
    color:#D7E6E9; font-family:inherit; font-size:14px; padding:11px 18px;
    cursor:pointer; border-right:3px solid transparent; transition:.15s;
  }
  .nav button .ic{font-size:16px; width:20px; text-align:center;}
  .nav button:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav button.active{
    background:rgba(255,255,255,.09); color:#fff; font-weight:700;
    border-right-color:#7FD8C4;
  }
  .sidebar-foot{
    padding:14px 18px; font-size:11px; color:#93AEB4; border-top:1px solid rgba(255,255,255,.12);
  }
  .save-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:#7FD8C4; margin-left:5px;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:26px 30px 60px 30px;}
  .pagehead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
  .pagehead h1{font-size:21px; margin:0; color:var(--navy-deep); font-weight:800;}
  .pagehead .desc{color:var(--muted); font-size:12.5px; margin-top:3px;}
  .facility-chip{
    background:#fff; border:1px solid var(--border); border-radius:20px;
    padding:6px 14px; font-size:12px; color:var(--navy); display:flex; gap:8px; align-items:center;
  }

  .grid{display:grid; gap:16px;}
  .grid.kpi{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px; position:relative; overflow:hidden;
  }
  .card.section{margin-bottom:22px;}
  .card h2{font-size:15px; margin:0 0 14px 0; color:var(--navy-deep); font-weight:800; display:flex; align-items:center; gap:8px;}
  .card h2 .tag{font-size:11px; font-weight:600; color:var(--teal); background:var(--teal-light); padding:2px 9px; border-radius:20px;}

  .kpi-card{border-top:4px solid var(--teal);}
  .kpi-card.state-good{border-top-color:var(--good);}
  .kpi-card.state-alert{border-top-color:var(--alert);}
  .kpi-card .label{font-size:12px; color:var(--muted); margin-bottom:6px;}
  .kpi-card .value{font-size:26px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums;}
  .kpi-card .unit{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .kpi-card .trend{font-size:12px; margin-top:8px; display:flex; align-items:center; gap:5px;}
  .trend.up{color:var(--alert);} .trend.down{color:var(--good);} .trend.flat{color:var(--muted);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  table.wide{min-width:640px;}
  th,td{padding:8px 9px; border-bottom:1px solid var(--border); text-align:center;}
  th{background:var(--teal-light); color:var(--navy-deep); font-weight:700; font-size:12.3px;}
  td:first-child, th:first-child{text-align:right;}
  tr:hover td{background:#FAFCFB;}
  input[type=number], input[type=text], input[type=date]{
    width:100%; padding:6px 7px; border:1px solid var(--border); border-radius:6px;
    font-family:inherit; font-size:13px; text-align:center; background:#fff;
  }
  input[type=text]{text-align:right;}
  input:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
  input.locked{background:var(--teal-light); color:var(--navy); font-weight:700; border-style:dashed;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}

  .btn{
    background:var(--teal); color:#fff; border:none; border-radius:8px;
    padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .btn:hover{background:var(--navy);}
  .btn.ghost{background:#fff; color:var(--teal); border:1px solid var(--teal);}
  .btn.danger{background:#fff; color:var(--alert); border:1px solid var(--alert);}
  .btn.small{padding:5px 11px; font-size:12px;}

  .alert-list{display:flex; flex-direction:column; gap:8px;}
  .alert-item{
    display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:8px;
    background:var(--alert-bg); color:#7A3417; font-size:13px; border:1px solid #EFC3AE;
  }
  .ok-banner{
    display:flex; align-items:center; gap:9px; padding:12px 14px; border-radius:8px;
    background:var(--good-bg); color:#215736; border:1px solid #BFE0CB; font-weight:700; font-size:13.5px;
  }
  .badge{padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:700;}
  .badge.ok{background:var(--good-bg); color:var(--good);}
  .badge.review{background:var(--alert-bg); color:var(--alert);}
  .badge.na{background:#EFEFEF; color:var(--muted);}

  .note{
    font-size:12px; color:var(--muted); background:#FBFAF6; border:1px dashed var(--border);
    border-radius:8px; padding:10px 12px; margin-top:6px;
  }
  .def-block{border-right:3px solid var(--teal); padding:10px 14px; margin-bottom:14px; background:var(--teal-light); border-radius:0 8px 8px 0;}
  .def-block h3{margin:0 0 5px 0; font-size:14px; color:var(--navy-deep);}
  .def-block p{margin:0; font-size:13px; color:#334;}

  .formula-guide td{text-align:right;}
  .formula-guide code{background:#EEF3F2; padding:2px 6px; border-radius:5px; font-size:12px; direction:ltr; display:inline-block;}

  @media (max-width:820px){
    .app{flex-direction:column;}
    .sidebar{
      position:fixed; bottom:0; right:0; left:0; top:auto; width:100%; height:64px;
      flex-direction:row; z-index:40; box-shadow:0 -2px 10px rgba(0,0,0,.18);
    }
    .brand, .sidebar-foot{display:none;}
    .nav{display:flex; padding:0; overflow-x:auto; width:100%;}
    .nav button{
      flex:1 0 auto; flex-direction:column; gap:2px; padding:8px 6px;
      border-right:none; border-top:3px solid transparent; font-size:10.5px; min-width:64px;
    }
    .nav button .ic{font-size:19px;}
    .nav button.active{border-top-color:#7FD8C4; border-right-color:transparent;}
    .main{padding:16px 14px 84px 14px;}
    .row2,.row3{grid-template-columns:1fr;}
    .pagehead{flex-direction:column; align-items:flex-start;}
  }
  .hidden{display:none !important;}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--navy-deep); color:#fff; padding:10px 20px; border-radius:30px;
    font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="title">🏥 نظام ترصد العدوى</div>
      <div class="sub">HAI Surveillance · CDC/NHSN &amp; WHO</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span class="save-dot"></span><span id="saveStatus">جاهز</span>
      <button class="btn ghost small" id="btnLogoutSidebar" style="width:100%; margin-top:8px;">تسجيل الخروج</button>
    </div>
  </aside>

  <main class="main">
    <div class="pagehead">
      <div>
        <h1 id="pageTitle">لوحة المتابعة</h1>
        <div class="desc" id="pageDesc">نظرة عامة على مؤشرات العدوى المكتسبة من الرعاية الصحية</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="facility-chip">🏥 <span id="chipFacility">اسم المنشأة غير مُدخل</span> · <span id="chipPeriod">—</span></div>
        <button class="btn ghost small" id="btnLogoutTop">خروج</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DATA MODEL
   ============================================================ */
const DEPT_META = [
  {id:'icu',  name:'العناية المركزة', censusLinked:true, censusSource:'icu'},
  {id:'nicu', name:'الحضانة',        censusLinked:true, censusSource:'nicu'},
  {id:'d3',   name:'',               censusLinked:false},
  {id:'d4',   name:'',               censusLinked:false},
];

const WEIGHT_CATS = [
  {id:'w1', label:'≤ 750 جم'},
  {id:'w2', label:'751 – 1000 جم'},
  {id:'w3', label:'1001 – 1500 جم'},
  {id:'w4', label:'1501 – 2500 جم'},
  {id:'w5', label:'> 2500 جم'},
];

const OP_TYPES = [
  {id:'hyst',     label:'استئصال الرحم'},
  {id:'appx',     label:'استئصال الزائدة الدودية'},
  {id:'chole',    label:'استئصال المرارة'},
  {id:'hipknee',  label:'مفاصل الفخذ والركبة الصناعية'},
  {id:'cabg',     label:'عمليات القلب المفتوح (CABG)'},
  {id:'fracture', label:'تثبيت الكسور (عظام)'},
  {id:'cataract', label:'عدسة العين (الماء الأبيض)'},
  {id:'cs',       label:'العملية القيصرية'},
];

function emptyDept(meta){
  return { name: meta.name, patientDays:null, cvcDays:null, ucDays:null, ventDays:null,
           bsi:null, clabsi:null, uti:null, cauti:null, hap:null, vap:null };
}

function defaultNicuCensus(){
  const obj = {};
  WEIGHT_CATS.forEach(w=>{
    obj[w.id] = Array.from({length:31}, (_,i)=>({day:i+1, pts:null, uc:null, cl:null, mv:null}));
  });
  return obj;
}

function defaultSurgeryCensus(){
  const obj = {};
  OP_TYPES.forEach(t=>{
    obj[t.id] = { days: Array.from({length:31}, ()=>null), ssiCases: null };
  });
  return obj;
}

const ABX_DEPTS = [
  {id:'nicu', label:'الحضانة'},
  {id:'internal', label:'الداخلي'},
  {id:'icu', label:'العناية المركزة'},
  {id:'intermediate', label:'الرعاية الوسطية'},
];

function emptyAbxDay(day){
  return { day, patients:null, prescriptions:null, group1:null, group2:null, group3:null };
}

function defaultAbxCensus(){
  const obj = {};
  ABX_DEPTS.forEach(d=>{
    obj[d.id] = Array.from({length:31}, (_,i)=>emptyAbxDay(i+1));
  });
  return obj;
}

const ORGANISMS = ['Staphylococcus aureus','MRSA','Coagulase-negative Staphylococci','Enterococcus spp.','VRE',
  'E. coli','Klebsiella spp.','Pseudomonas aeruginosa','Acinetobacter spp.','Candida spp.','أخرى','غير معروف'];
const RESISTANCE = ['لا يوجد','MDR','XDR','PDR','ESBL','CRE','غير معروف'];
const INFECTION_TYPES = ['CLABSI','CAUTI','VAP','VAE','Non-device BSI','Non-CAUTI UTI','NV-HAP','أخرى'];
const DEVICE_TYPES = ['قسطرة مركزية (CVC)','قسطرة بولية (Foley)','جهاز تنفس صناعي (MV)','لا يوجد'];
const OUTCOMES = ['تحسّن','تحويل','توفي','مازال بالمستشفى'];
const SSI_CLASS = ['سطحية (Superficial)','عميقة (Deep)','عضو/تجويف (Organ/Space)'];

function emptyInfectionCase(dept){
  return { id: 'c'+Date.now()+Math.random().toString(36).slice(2,6), dept,
    patientName:'', medicalRecord:'', admissionDate:'', device:'', onsetDate:'',
    infectionType:'', organism:'', resistance:'', dischargeDate:'', outcome:'',
    createdBy:'', createdAt:'' };
}
function emptySsiCase(){
  return { id: 's'+Date.now()+Math.random().toString(36).slice(2,6),
    patientName:'', fileNumber:'', surgeryDate:'', opType:'', surgeon:'',
    organism:'', resistance:'', classification:'', createdBy:'', createdAt:'' };
}

function defaultState(){
  return {
    facility:{ name:'مستشفى الحمام المركزي', dept:'', period:'2026', preparedBy:'فريق مكافحة العدوى\nد/ أحمد عبدالله سعيد', reviewedBy:'', approvalDate:'' },
    census:{ days: Array.from({length:31}, (_,i)=>({day:i+1, patients:null, uc:null, tempCVC:null, permCVC:null, vent:null})) },
    nicuCensus: defaultNicuCensus(),
    depts: DEPT_META.map(emptyDept),
    surgeryCensus: defaultSurgeryCensus(),
    abxCensus: defaultAbxCensus(),
    infectionCases: [],
    ssiCases: [],
    previous:{ cauti:'', clabsi:'', vap:'' },
    lastSaved:null
  };
}

let state = defaultState();

/* ============================================================
   PERSISTENCE (Firebase Firestore — shared, real-time,
   works for multiple people at the same time)
   ============================================================ */
let saveTimer=null;
let db = null;
let suppressNextSnapshot = false;
let unsubscribeSnapshot = null;

function initFirebase(){
  db = window.__firestoreDb;
  if(!db || !targetUid) return;
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
  const { doc, onSnapshot } = window.__firestoreFns;
  unsubscribeSnapshot = onSnapshot(doc(db,'hospitals',targetUid), (snap)=>{
    if(suppressNextSnapshot){ suppressNextSnapshot=false; return; }
    if(snap.exists()){
      const loaded = snap.data();
      state = Object.assign(defaultState(), loaded);
      if(!state.depts || state.depts.length!==4){ state.depts = DEPT_META.map(emptyDept); }
      if(!state.nicuCensus){ state.nicuCensus = defaultNicuCensus(); }
      if(!state.surgeryCensus){ state.surgeryCensus = defaultSurgeryCensus(); }
      if(!state.abxCensus){ state.abxCensus = defaultAbxCensus(); }
      if(!state.infectionCases){ state.infectionCases = []; }
      if(!state.ssiCases){ state.ssiCases = []; }
    } else {

  }, (err)=>{

  });
}

/* ============================================================
   CALCULATIONS  (mirrors the Excel workbook's logic exactly)
   ============================================================ */
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function rate(n,d,mult){ return d>0 ? (n/d*mult) : null; }
function fmt(v, digits=1){ return (v===null || v===undefined) ? '—' : v.toFixed(digits); }

function censusTotals(){
  const t = {patients:0, uc:0, tempCVC:0, permCVC:0, vent:0};
  state.census.days.forEach(d=>{
    t.patients += num(d.patients); t.uc += num(d.uc);
    t.tempCVC += num(d.tempCVC); t.permCVC += num(d.permCVC); t.vent += num(d.vent);
  });
  return t;
}

function nicuCensusTotals(){
  const t = {pts:0, uc:0, cl:0, mv:0};
  WEIGHT_CATS.forEach(w=>{
    (state.nicuCensus[w.id]||[]).forEach(d=>{
      t.pts += num(d.pts); t.uc += num(d.uc); t.cl += num(d.cl); t.mv += num(d.mv);
    });
  });
  return t;
}

function nicuCensusTotalsByWeight(wid){
  const t = {pts:0, uc:0, cl:0, mv:0};
  (state.nicuCensus[wid]||[]).forEach(d=>{
    t.pts += num(d.pts); t.uc += num(d.uc); t.cl += num(d.cl); t.mv += num(d.mv);
  });
  return t;
}

function effectiveDept(i){
  const d = state.depts[i];
  const meta = DEPT_META[i];
  if(meta.censusSource==='icu'){
    const c = censusTotals();
    return { name:d.name || meta.name, patientDays:c.patients, cvcDays:c.tempCVC+c.permCVC,
             ucDays:c.uc, ventDays:c.vent, bsi:num(d.bsi), clabsi:num(d.clabsi),
             uti:num(d.uti), cauti:num(d.cauti), hap:num(d.hap), vap:num(d.vap) };
  }
  if(meta.censusSource==='nicu'){
    const c = nicuCensusTotals();
    return { name:d.name || meta.name, patientDays:c.pts, cvcDays:c.cl,
             ucDays:c.uc, ventDays:c.mv, bsi:num(d.bsi), clabsi:num(d.clabsi),
             uti:num(d.uti), cauti:num(d.cauti), hap:num(d.hap), vap:num(d.vap) };
  }
  return { name:d.name, patientDays:num(d.patientDays), cvcDays:num(d.cvcDays), ucDays:num(d.ucDays),
           ventDays:num(d.ventDays), bsi:num(d.bsi), clabsi:num(d.clabsi), uti:num(d.uti),
           cauti:num(d.cauti), hap:num(d.hap), vap:num(d.vap) };
}

function computeDept(i){
  const e = effectiveDept(i);
  const nonDeviceBSI = Math.max(0, e.bsi - e.clabsi);
  const nonCautiUTI  = Math.max(0, e.uti - e.cauti);
  const nvHAP        = Math.max(0, e.hap - e.vap);
  return {
    ...e,
    bsiRate: rate(e.bsi, e.patientDays, 1000),
    clabsiRate: rate(e.clabsi, e.cvcDays, 1000),
    durCVC: rate(e.cvcDays, e.patientDays, 100),
    nonDeviceBSI, nonDeviceBSIRate: rate(nonDeviceBSI, e.patientDays, 1000),
    utiRate: rate(e.uti, e.patientDays, 1000),
    cautiRate: rate(e.cauti, e.ucDays, 1000),
    durUC: rate(e.ucDays, e.patientDays, 100),
    nonCautiUTI, nonCautiUTIRate: rate(nonCautiUTI, e.patientDays, 1000),
    hapRate: rate(e.hap, e.patientDays, 1000),
    vapRate: rate(e.vap, e.ventDays, 1000),
    durVent: rate(e.ventDays, e.patientDays, 100),
    nvHAP, nvHAPRate: rate(nvHAP, e.patientDays, 1000),
    alertCVC: e.cvcDays > e.patientDays && e.patientDays>0,
    alertUC:  e.ucDays  > e.patientDays && e.patientDays>0,
    alertVent:e.ventDays> e.patientDays && e.patientDays>0,
  };
}

function computeTotals(){
  const all = [0,1,2,3].map(computeDept);
  const sum = k => all.reduce((a,d)=>a+num(d[k]),0);
  const patientDays = sum('patientDays'), cvcDays=sum('cvcDays'), ucDays=sum('ucDays'), ventDays=sum('ventDays');
  const bsi=sum('bsi'), clabsi=sum('clabsi'), uti=sum('uti'), cauti=sum('cauti'), hap=sum('hap'), vap=sum('vap');
  const nonDeviceBSI = Math.max(0,bsi-clabsi), nonCautiUTI = Math.max(0,uti-cauti), nvHAP = Math.max(0,hap-vap);
  return {
    all, patientDays, cvcDays, ucDays, ventDays, bsi, clabsi, uti, cauti, hap, vap,
    bsiRate: rate(bsi,patientDays,1000), clabsiRate: rate(clabsi,cvcDays,1000), durCVC: rate(cvcDays,patientDays,100),
    nonDeviceBSI, nonDeviceBSIRate: rate(nonDeviceBSI,patientDays,1000),
    utiRate: rate(uti,patientDays,1000), cautiRate: rate(cauti,ucDays,1000), durUC: rate(ucDays,patientDays,100),
    nonCautiUTI, nonCautiUTIRate: rate(nonCautiUTI,patientDays,1000),
    hapRate: rate(hap,patientDays,1000), vapRate: rate(vap,ventDays,1000), durVent: rate(ventDays,patientDays,100),
    nvHAP, nvHAPRate: rate(nvHAP,patientDays,1000),
  };
}

function surgeryTypeTotals(id){
  const entry = state.surgeryCensus[id] || {days:[], ssiCases:null};
  const operations = (entry.days||[]).reduce((a,v)=>a+num(v),0);
  const ssiCases = num(entry.ssiCases);
  return { operations, ssiCases, rate: rate(ssiCases, operations, 100) };
}

function ssiRate(){
  let cases=0, operations=0;
  OP_TYPES.forEach(t=>{
    const tt = surgeryTypeTotals(t.id);
    cases += tt.ssiCases; operations += tt.operations;
  });
  return { cases, operations, rate: rate(cases, operations, 100) };
}

function abxTotals(deptId){
  const t = {patients:0, prescriptions:0, group1:0, group2:0, group3:0};
  (state.abxCensus[deptId]||[]).forEach(d=>{
    t.patients += num(d.patients); t.prescriptions += num(d.prescriptions);
    t.group1 += num(d.group1); t.group2 += num(d.group2); t.group3 += num(d.group3);
  });
  return t;
}

function abxHospitalWide(){
  const totals = ABX_DEPTS.reduce((acc,d)=>{
    const t = abxTotals(d.id);
    acc.prescriptions += t.prescriptions; acc.group1 += t.group1;
    acc.group2 += t.group2; acc.group3 += t.group3;
    return acc;
  }, {prescriptions:0, group1:0, group2:0, group3:0});
  return { ...totals, accessRate: rate(totals.group1, totals.prescriptions, 100) };
}

function allAlerts(){
  const list=[];
  [0,1,2,3].forEach(i=>{
    const d = computeDept(i); const meta = DEPT_META[i]; const label = d.name || meta.name || `قسم ${i+1}`;
    if(d.alertCVC)  list.push(`${label}: أيام القسطرة المركزية (${d.cvcDays}) أكبر من أيام الإقامة (${d.patientDays})`);
    if(d.alertUC)   list.push(`${label}: أيام القسطرة البولية (${d.ucDays}) أكبر من أيام الإقامة (${d.patientDays})`);
    if(d.alertVent) list.push(`${label}: أيام جهاز التنفس (${d.ventDays}) أكبر من أيام الإقامة (${d.patientDays})`);
  });
  return list;
}

function trendBlock(current, prevKey, label){
  const prev = state.previous[prevKey];
  if(prev==='' || prev===null || prev===undefined || isNaN(parseFloat(prev))){
    return `<div class="trend flat">— لا توجد بيانات شهر سابق</div>`;
  }
  const p = parseFloat(prev);
  if(current > p) return `<div class="trend up">▲ ارتفاع عن الشهر السابق (${p})</div>`;
  if(current < p) return `<div class="trend down">▼ انخفاض عن الشهر السابق (${p})</div>`;
  return `<div class="trend flat">→ ثابت عن الشهر السابق (${p})</div>`;
}

function kpiCard(label, value, unit, stateClass='', trendHtml=''){
  return `<div class="card kpi-card ${stateClass}">

    <div class="value">${value}</div>
    <div class="unit">${unit}</div>

}

        </tr></tfoot>

    btn.addEventListener('click', ()=>{ currentNicuWeight = btn.dataset.weight; viewNicuCensus(); });
  });
  document.getElementById('view').querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const i = +inp.dataset.i, f = inp.dataset.f;
      state.nicuCensus[currentNicuWeight][i][f] = inp.value===''? null : inp.value;
      queueSave();

      // live-update: daily-table footer for the active weight category
      const t = nicuCensusTotalsByWeight(currentNicuWeight);
      const totalsRow = document.querySelector('#view tfoot tr');
      totalsRow.children[1].textContent = t.pts;
      totalsRow.children[2].textContent = t.uc;
      totalsRow.children[3].textContent = t.cl;
      totalsRow.children[4].textContent = t.mv;

      // live-update: the matching row in the "ملخص فئات الوزن" summary table
      const rowIndex = WEIGHT_CATS.findIndex(w=>w.id===currentNicuWeight);
      const summaryRow = document.querySelectorAll('#nicuSummaryBody tr')[rowIndex];
      if(summaryRow){
        summaryRow.children[1].textContent = t.pts;
        summaryRow.children[2].textContent = t.uc;
        summaryRow.children[3].textContent = t.cl;
        summaryRow.children[4].textContent = t.mv;
      }

      // live-update: the 4 top KPI cards (combined across all weight categories)
      const c = nicuCensusTotals();
      document.getElementById('kpiNicuPts').textContent = c.pts;
      document.getElementById('kpiNicuCl').textContent = c.cl;
      document.getElementById('kpiNicuUc').textContent = c.uc;
      document.getElementById('kpiNicuMv').textContent = c.mv;
    });
  });
}

const DEVICE_CONFIG = {
  bsi: {

    caseLabel:'حالات BSI (إجمالي)', caseKey:'bsi',

    rateKey:'bsiRate', devRateKey:'clabsiRate', durKey:'durCVC',
    ndLabel:'BSI غير مرتبطة', ndKey:'nonDeviceBSI', ndRateKey:'nonDeviceBSIRate',
    alertKey:'alertCVC', unit:'يوم قسطرة مركزية'
  },
  uti: {
    title:'UTI & CAUTI', dayLabel:'أيام القسطرة البولية', dayKey:'ucDays',
    caseLabel:'حالات UTI (إجمالي)', caseKey:'uti',
    devCaseLabel:'حالات CAUTI', devCaseKey:'cauti',
    rateKey:'utiRate', devRateKey:'cautiRate', durKey:'durUC',
    ndLabel:'UTI غير مرتبطة', ndKey:'nonCautiUTI', ndRateKey:'nonCautiUTIRate',
    alertKey:'alertUC', unit:'يوم قسطرة بولية'
  },
  hap: {
    title:'HAP & VAP', dayLabel:'أيام جهاز التنفس', dayKey:'ventDays',
    caseLabel:'حالات HAP (إجمالي)', caseKey:'hap',
    devCaseLabel:'حالات VAP', devCaseKey:'vap',
    rateKey:'hapRate', devRateKey:'vapRate', durKey:'durVent',
    ndLabel:'NV-HAP (غير مرتبط بجهاز)', ndKey:'nvHAP', ndRateKey:'nvHAPRate',
    alertKey:'alertVent', unit:'يوم جهاز تنفس'
  }
};

function viewDevice(kind){
  const cfg = DEVICE_CONFIG[kind];
  const computed = [0,1,2,3].map(computeDept);
  const totals = computeTotals();

  let rows = computed.map((d,i)=>{
    const meta = DEPT_META[i];
    const nameField = meta.censusLinked
      ? `<b>${d.name}</b> <span style="color:var(--muted); font-size:11px;">(مربوط بالبيانات اليومية)</span>`
      : `<input type="text" data-i="${i}" data-f="name" value="${state.depts[i].name||''}" placeholder="اسم القسم">`;
    const patientDaysCell = meta.censusLinked
      ? `<input class="locked" value="${d.patientDays}" disabled>`
      : `<input type="number" min="0" data-i="${i}" data-f="patientDays" value="${state.depts[i].patientDays??''}">`;
    const dayCell = meta.censusLinked
      ? `<input class="locked" value="${d[cfg.dayKey]}" disabled>`
      : `<input type="number" min="0" data-i="${i}" data-f="${cfg.dayKey}" value="${state.depts[i][cfg.dayKey]??''}">`;
    const alertBadge = d[cfg.alertKey] ? `<span class="badge review">⚠ تنبيه</span>` : `<span class="badge ok">✓ سليم</span>`;
    return `<tr>
      <td>${nameField}</td>
      <td>${patientDaysCell}</td>
      <td><input type="number" min="0" data-i="${i}" data-f="${cfg.caseKey}" value="${state.depts[i][cfg.caseKey]??''}"></td>
      <td>${dayCell}</td>
      <td><input type="number" min="0" data-i="${i}" data-f="${cfg.devCaseKey}" value="${state.depts[i][cfg.devCaseKey]??''}"></td>
      <td>${fmt(d[cfg.devRateKey])}</td>
      <td>${fmt(d[cfg.durKey])}%</td>
      <td>${d[cfg.ndKey]} <span style="color:var(--muted); font-size:11px;">(${fmt(d[cfg.ndRateKey])})</span></td>
      <td>${alertBadge}</td>
    </tr>`;
  }).join('');

  document.getElementById('view').innerHTML = `
    <div class="grid kpi" style="margin-bottom:18px;">
      ${kpiCard('إجمالي '+cfg.devCaseLabel, totals[cfg.devCaseKey], 'حالة')}
      ${kpiCard('معدل '+cfg.devCaseLabel, fmt(totals[cfg.devRateKey]), 'لكل 1000 '+cfg.unit)}
      ${kpiCard('نسبة الاستخدام (DUR)', fmt(totals[cfg.durKey])+'%', 'أيام الجهاز / أيام الإقامة')}
      ${kpiCard(cfg.ndLabel, totals[cfg.ndKey], 'حالة · معدل '+fmt(totals[cfg.ndRateKey]))}
    </div>
    <div class="card section">
      <h2>${cfg.title} — بيانات الأقسام</h2>
      <div style="overflow:auto;">
      <table>
        <thead><tr>
          <th>القسم</th><th>أيام الإقامة</th><th>${cfg.caseLabel}</th><th>${cfg.dayLabel}</th>
          <th>${cfg.devCaseLabel}</th><th>معدل</th><th>DUR</th><th>${cfg.ndLabel}</th><th>الحالة</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    </div>`;

  document.getElementById('view').querySelectorAll('input:not(.locked)').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const i = +inp.dataset.i, f = inp.dataset.f;
      state.depts[i][f] = inp.value===''? (f==='name'? '': null) : inp.value;
      queueSave(); viewDevice(kind);
    });
  });
}

  });

    c.patientName = document.getElementById('sPatient').value;

    c.opType = document.getElementById('sOpType').value;

  const summaryRows = allTotals.map(d=>`
    <tr>
      <td>${d.label}</td><td>${d.t.patients}</td><td>${d.t.prescriptions}</td>
      <td>${d.t.group1}</td><td>${d.t.group2}</td><td>${d.t.group3}</td>
    </tr>`).join('');

  const tabs = ABX_DEPTS.map(d=>`
    <button class="btn ${d.id===currentAbxDept?'':'ghost'} small" data-dept="${d.id}" style="margin-left:6px; margin-bottom:6px;">${d.label}</button>
  `).join('');

  const days = state.abxCensus[currentAbxDept];
  const rows = days.map((d,i)=>`
    <tr>
      <td>${d.day}</td>
      <td><input type="number" min="0" data-i="${i}" data-f="patients" value="${d.patients??''}"></td>
      <td><input type="number" min="0" data-i="${i}" data-f="prescriptions" value="${d.prescriptions??''}"></td>
      <td><input type="number" min="0" data-i="${i}" data-f="group1" value="${d.group1??''}"></td>
      <td><input type="number" min="0" data-i="${i}" data-f="group2" value="${d.group2??''}"></td>
      <td><input type="number" min="0" data-i="${i}" data-f="group3" value="${d.group3??''}"></td>
    </tr>`).join('');
  const t = abxTotals(currentAbxDept);
  const hw = abxHospitalWide();
  const accessStateClass = hw.accessRate===null ? '' : (hw.accessRate>=60 ? 'state-good' : 'state-alert');

  document.getElementById('view').innerHTML = `
    <div class="grid kpi" style="margin-bottom:18px;">
      ${kpiCard('إجمالي وصفات المضادات (المستشفى ككل)', hw.prescriptions, 'وصفة').replace('<div class="value">', `<div class="value" id="kpiAbxTotal">`)}
      ${kpiCard('وصفات فئة الإتاحة (Access)', hw.group1, 'وصفة').replace('<div class="value">', `<div class="value" id="kpiAbxAccess">`)}
      <div class="card kpi-card ${accessStateClass}" id="kpiAbxRateCard">
        <div class="label">نسبة استخدام فئة الإتاحة (Access) للمستشفى ككل</div>
        <div class="value" id="kpiAbxRate">${fmt(hw.accessRate)}%</div>
        <div class="unit">الهدف الموصى به من WHO: 60% أو أكثر</div>
      </div>
    </div>

    <div class="card section">
      <h2>ملخص الأقسام <span class="tag">تلقائي</span></h2>
      <div style="overflow:auto;">
      <table>
        <thead><tr><th>القسم</th><th>إجمالي المرضى</th><th>إجمالي الوصفات</th><th>الإتاحة (Access)</th><th>المراقبة (Watch)</th><th>الاحتياطي (Reserve)</th></tr></thead>
        <tbody id="abxSummaryBody">${summaryRows}</tbody>
      </table>
      </div>
      <div class="note">التصنيف حسب معايير منظمة الصحة العالمية (WHO AWaRe): الإتاحة (Access) — خط أول آمن وموصى به، المراقبة (Watch) — احتمال مقاومة أعلى، الاحتياطي (Reserve) — يُستخدم للحالات المقاومة فقط.</div>
    </div>

    <div class="card section">
      <h2>💊 السجل اليومي حسب القسم <span class="tag">31 يوم</span></h2>
      <div style="margin-bottom:10px;">${tabs}</div>
      <div style="max-height:460px; overflow:auto; border:1px solid var(--border); border-radius:8px;">
      <table class="wide">
        <thead><tr><th>اليوم</th><th>عدد المرضى</th><th>عدد وصفات المضادات</th><th>الإتاحة (Access)</th><th>المراقبة (Watch)</th><th>الاحتياطي (Reserve)</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr style="font-weight:800; background:var(--teal-light);">
          <td>الإجمالي</td><td>${t.patients}</td><td>${t.prescriptions}</td><td>${t.group1}</td><td>${t.group2}</td><td>${t.group3}</td>
        </tr></tfoot>
      </table>
      </div>
    </div>`;

  document.getElementById('view').querySelectorAll('button[data-dept]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentAbxDept = btn.dataset.dept; viewAbx(); });
  });
  document.getElementById('view').querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const i = +inp.dataset.i, f = inp.dataset.f;
      state.abxCensus[currentAbxDept][i][f] = inp.value===''? null : inp.value;
      queueSave();

      // live-update: daily-table footer for the active department
      const tt = abxTotals(currentAbxDept);
      const totalsRow = document.querySelector('#view tfoot tr');
      totalsRow.children[1].textContent = tt.patients;
      totalsRow.children[2].textContent = tt.prescriptions;
      totalsRow.children[3].textContent = tt.group1;
      totalsRow.children[4].textContent = tt.group2;
      totalsRow.children[5].textContent = tt.group3;

      // live-update: the matching row in "ملخص الأقسام"
      const rowIndex = ABX_DEPTS.findIndex(d=>d.id===currentAbxDept);
      const summaryRow = document.querySelectorAll('#abxSummaryBody tr')[rowIndex];
      if(summaryRow){
        summaryRow.children[1].textContent = tt.patients;
        summaryRow.children[2].textContent = tt.prescriptions;
        summaryRow.children[3].textContent = tt.group1;
        summaryRow.children[4].textContent = tt.group2;
        summaryRow.children[5].textContent = tt.group3;
      }

      // live-update: hospital-wide KPI cards, including the Access-rate color state
      const nhw = abxHospitalWide();
      document.getElementById('kpiAbxTotal').textContent = nhw.prescriptions;
      document.getElementById('kpiAbxAccess').textContent = nhw.group1;
      document.getElementById('kpiAbxRate').textContent = fmt(nhw.accessRate) + '%';
      const rateCard = document.getElementById('kpiAbxRateCard');
      rateCard.classList.remove('state-good','state-alert');
      if(nhw.accessRate!==null) rateCard.classList.add(nhw.accessRate>=60 ? 'state-good' : 'state-alert');
    });
  });
}

  ['fName','fDept','fPeriod','fPrep','fRev','fDate'].forEach(id=>{

      state.facility[map[id]] = e.target.value; queueSave(); renderHead();

  });

    exportToExcel();
    await archiveCurrentMonth();
    const t = computeTotals();
    state.previous.cauti = String(t.cauti);
    state.previous.clabsi = String(t.clabsi);
    state.previous.vap = String(t.vap);
    const keepFacility = state.facility, keepPrevious = state.previous;
    state = defaultState();
    state.facility = keepFacility;
    state.previous = keepPrevious;
    await saveState();
    showToast('تم إغلاق الشهر، وحُفظت نسخة في الأرشيف');

  });

      state = defaultState();
      await saveState();
      showToast('تم مسح البيانات');
      currentPage='dashboard'; renderAll();
    }
  });
}

/* ============================================================
   EXCEL EXPORT (matches the original workbook's sheet layout)
   ============================================================ */
function exportToExcel(customState){
  const original = state;
  if(customState) state = customState;
  try{
  const wb = XLSX.utils.book_new();
  const t = computeTotals();
  const ssi = ssiRate();
  const period = state.facility.period || new Date().toISOString().slice(0,7);

  // --- الغلاف ---
  const cover = [
    ['نظام ترصد عدوى المنشآت الصحية (HAI Surveillance System)'],
    [],
    ['اسم المنشأة الصحية', state.facility.name||''],
    ['القسم / الجناح', state.facility.dept||''],
    ['فترة الترصد', state.facility.period||''],
    ['أُعدت بواسطة', state.facility.preparedBy||''],
    ['راجعها', state.facility.reviewedBy||''],
    ['تاريخ الاعتماد', state.facility.approvalDate||''],
    ['تاريخ التصدير', new Date().toLocaleString('ar-EG')],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cover), 'الغلاف');

  // --- تجميع بيانات ---
  const censusHead = ['اليوم','عدد المرضى','عدد المرضى بقسطرة بولية','قسطرة مركزية مؤقتة','قسطرة مركزية دائمة','مرضى على جهاز تنفس'];
  const censusRows = state.census.days.map(d=>[d.day, d.patients??'', d.uc??'', d.tempCVC??'', d.permCVC??'', d.vent??'']);
  const ct = censusTotals();
  censusRows.push(['الإجمالي', ct.patients, ct.uc, ct.tempCVC, ct.permCVC, ct.vent]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([censusHead, ...censusRows]), 'تجميع بيانات');

  // --- BSI & CLABSI / UTI & CAUTI / HAP & VAP ---
  const deviceSheet = (cfg, name)=>{
    const head = ['القسم','أيام الإقامة',cfg.caseLabel,cfg.dayLabel,cfg.devCaseLabel,'المعدل','DUR %',cfg.ndLabel,'معدل غير المرتبط'];
    const rows = [0,1,2,3].map(i=>{
      const d = computeDept(i);
      return [d.name||DEPT_META[i].name, d.patientDays, d[cfg.caseKey], d[cfg.dayKey], d[cfg.devCaseKey],
              fmt(d[cfg.devRateKey]), fmt(d[cfg.durKey]), d[cfg.ndKey], fmt(d[cfg.ndRateKey])];
    });
    rows.push(['الإجمالي', t.patientDays, t[cfg.caseKey], t[cfg.dayKey], t[cfg.devCaseKey],
               fmt(t[cfg.devRateKey]), fmt(t[cfg.durKey]), t[cfg.ndKey], fmt(t[cfg.ndRateKey])]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...rows]), name);
  };
  deviceSheet(DEVICE_CONFIG.bsi, 'BSI & CLABSI');
  deviceSheet(DEVICE_CONFIG.uti, 'UTI & CAUTI');
  deviceSheet(DEVICE_CONFIG.hap, 'HAP & VAP');

  // --- تجميع بيانات الحضانة (NICU, weight-stratified) ---
  const nicuHead = ['اليوم'];
  WEIGHT_CATS.forEach(w=> nicuHead.push(`${w.label} - Pts`, `${w.label} - U/C`, `${w.label} - CL`, `${w.label} - MV`));
  const nicuRows = Array.from({length:31}, (_,i)=>{
    const row = [i+1];
    WEIGHT_CATS.forEach(w=>{
      const d = state.nicuCensus[w.id][i];
      row.push(d.pts??'', d.uc??'', d.cl??'', d.mv??'');
    });
    return row;
  });
  const nicuTotalsRow = ['الإجمالي'];
  WEIGHT_CATS.forEach(w=>{
    const t = nicuCensusTotalsByWeight(w.id);
    nicuTotalsRow.push(t.pts, t.uc, t.cl, t.mv);
  });
  nicuRows.push(nicuTotalsRow);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([nicuHead, ...nicuRows]), 'تجميع بيانات الحضانة');

  // --- تجميع بيانات العمليات (كل الأنواع) ---
  const opHead = ['اليوم', ...OP_TYPES.map(t=>t.label)];
  const opRows = Array.from({length:31}, (_,i)=>[i+1, ...OP_TYPES.map(t=> state.surgeryCensus[t.id].days[i]??'')]);
  opRows.push(['الإجمالي', ...OP_TYPES.map(t=> surgeryTypeTotals(t.id).operations)]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([opHead, ...opRows]), 'تجميع بيانات العمليات');

  // --- SSI incidence (بالتفصيل حسب نوع العملية) ---
  const ssiHead = ['نوع العملية','عدد العمليات','عدد حالات SSI','المعدل لكل 100 عملية'];
  const ssiRows = OP_TYPES.map(t=>{
    const tt = surgeryTypeTotals(t.id);
    return [t.label, tt.operations, tt.ssiCases, fmt(tt.rate)];
  });
  ssiRows.push(['الإجمالي', ssi.operations, ssi.cases, fmt(ssi.rate)]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([ssiHead, ...ssiRows]), 'SSI incidence');

  // --- سرد حالات العدوى (ICU + NICU) ---
  ['icu','nicu'].forEach(dept=>{
    const cases = state.infectionCases.filter(c=>c.dept===dept);
    const head = ['اسم المريض','الرقم الطبي','تاريخ الدخول','الجهاز','نوع العدوى','تاريخ ظهور العدوى','الميكروب','نمط المقاومة','الحالة عند الخروج','أُضيفت بواسطة','تاريخ الإضافة'];
    const rows = cases.map(c=>[c.patientName,c.medicalRecord,c.admissionDate,c.device,c.infectionType,c.onsetDate,c.organism,c.resistance,c.outcome,c.createdBy||'',c.createdAt? new Date(c.createdAt).toLocaleString('ar-EG') : '']);
    const sheetName = dept==='icu' ? 'أقسام الرعايات المركزة' : 'الرعاية المركزة لحديثى الولادة';
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...rows]), sheetName);
  });

  // --- سرد حالات SSI بالاسم ---
  const ssiListHead = ['اسم المريض','رقم الملف','تاريخ العملية','نوع العملية','اسم الجراح','الميكروب','نمط المقاومة','تصنيف SSI','أُضيفت بواسطة','تاريخ الإضافة'];
  const ssiListRows = state.ssiCases.map(c=>[c.patientName,c.fileNumber,c.surgeryDate,c.opType,c.surgeon,c.organism,c.resistance,c.classification,c.createdBy||'',c.createdAt? new Date(c.createdAt).toLocaleString('ar-EG') : '']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([ssiListHead, ...ssiListRows]), 'سرد حالات SSI');

  // --- متابعة المضادات الحيوية (كل الأقسام جنب بعض) ---
  const abxHead = ['اليوم'];
  ABX_DEPTS.forEach(d=> abxHead.push(`${d.label} - المرضى`, `${d.label} - الوصفات`, `${d.label} - مج1`, `${d.label} - مج2`, `${d.label} - مج3`));
  const abxRows = Array.from({length:31}, (_,i)=>{
    const row = [i+1];
    ABX_DEPTS.forEach(d=>{
      const day = state.abxCensus[d.id][i];
      row.push(day.patients??'', day.prescriptions??'', day.group1??'', day.group2??'', day.group3??'');
    });
    return row;
  });
  const abxTotalsRow = ['الإجمالي'];
  ABX_DEPTS.forEach(d=>{
    const t = abxTotals(d.id);
    abxTotalsRow.push(t.patients, t.prescriptions, t.group1, t.group2, t.group3);
  });
  abxRows.push(abxTotalsRow);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([abxHead, ...abxRows]), 'متابعة المضادات الحيوية');

  const fname = `HAI_${(state.facility.name||'المنشأة').replace(/[^\u0600-\u06FFa-zA-Z0-9]/g,'_')}_${period}.xlsx`;
  XLSX.writeFile(wb, fname);
  showToast('تم تنزيل ملف Excel');
  } finally {
    state = original;
  }
}

/* ============================================================
   ARCHIVE (immutable — write-once, never editable or deletable)
   ============================================================ */
async function archiveCurrentMonth(){
  if(!db || !targetUid){ showToast('غير متصل بقاعدة البيانات — لم يُحفظ في الأرشيف'); return; }
  try{
    const { doc, setDoc } = window.__firestoreFns;
    const closedAt = new Date();
    const id = closedAt.toISOString().replace(/[:.]/g,'-');
    const t = computeTotals(); const ssi = ssiRate(); const nicu = nicuCensusTotals(); const hw = abxHospitalWide();
    const record = {
      closedAt: closedAt.toISOString(),
      period: state.facility.period || '',
      facilityName: state.facility.name || '',
      summary: {
        cauti:t.cauti, clabsi:t.clabsi, vap:t.vap, ssi:ssi.cases, operations:ssi.operations,
        nicuPatientDays: nicu.pts,
        abxPrescriptions: hw.prescriptions, abxAccessRate: hw.accessRate,
        casesLogged: state.infectionCases.length, ssiCasesLogged: state.ssiCases.length
      },
      snapshot: JSON.parse(JSON.stringify(state))
    };
    await setDoc(doc(db,'hospitals',targetUid,'archive', id), record);
  }catch(e){
    showToast('تعذّر الحفظ في الأرشيف');
  }
}

async function viewArchive(){

        <div class="note">كل شهر هنا سجل ثابت ونهائي — لا يمكن تعديله أو حذفه من أي مكان، حتى بعد إغلاقه. الأعمدة الفارغة (—) تعني إن الشهر ده اتقفل قبل إضافة هذا المؤشر.</div>
        <div style="overflow:auto; margin-top:12px;">
        <table>
          <thead><tr>
            <th>الفترة</th><th>المنشأة</th><th>تاريخ القفل</th><th>CAUTI</th><th>CLABSI</th><th>VAP</th><th>SSI</th>
            <th>أيام الحضانة</th><th>وصفات المضادات</th><th>نسبة الإتاحة</th><th>حالات مسجّلة بالاسم</th><th></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
      </div>`;

    document.getElementById('view').querySelectorAll('button[data-id]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const rec = records.find(r=>r.id===btn.dataset.id);
        if(rec && rec.snapshot) exportToExcel(rec.snapshot);
      });
    });
  }catch(e){
    document.getElementById('view').innerHTML = `<div class="card section"><h2>الأرشيف الشهري</h2><p>تعذّر تحميل الأرشيف. تأكد من ضبط صلاحيات القراءة لمجموعة hai_archive.</p></div>`;

/* ============================================================
   AUTH GATE — signup with admin approval, multi-tenant data
   ============================================================ */
const ADMIN_EMAIL = 'ahmed.abdallah.said1991@gmail.com';
let currentUser = null;   // Firebase Auth user object
let myProfile = null;     // this user's /users/{uid} doc
let isAdminUser = false;
let targetUid = null;     // whose hospital data is currently loaded
let adminUsersList = [];  // all /users docs, for the admin panel
let authMode = 'login';   // 'login' | 'signup'

function gateEl(){
  let gate = document.getElementById('authGate');
  if(!gate){
    gate = document.createElement('div');
    gate.id = 'authGate';
    document.body.appendChild(gate);
  }
  document.querySelector('.app').style.display = 'none';
  gate.style.cssText = 'min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--cream); padding:20px;';
  return gate;
}

function renderLogin(errorMsg){
  const gate = gateEl();
  const isSignup = authMode==='signup';
  gate.innerHTML = `
    <div class="card" style="max-width:380px; width:100%;">
      <div style="text-align:center; margin-bottom:16px;">
        <div style="font-size:32px;">🏥</div>
        <h1 style="font-size:17px; color:var(--navy-deep); margin:8px 0 2px 0;">نظام ترصد عدوى المنشآت الصحية</h1>
        <div style="font-size:12px; color:var(--muted);">${isSignup? 'إنشاء حساب جديد لمنشأتك — يحتاج موافقة المشرف قبل التفعيل' : 'سجّل الدخول للمتابعة'}</div>
      </div>
      ${isSignup? `<div class="field"><label>اسم المنشأة / المستشفى</label><input type="text" id="suHospital"></div>` : ''}
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="loginEmail"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="loginPass"></div>
      ${errorMsg ? `<div class="alert-item" style="margin-bottom:12px;">⚠ ${errorMsg}</div>` : ''}
      <button class="btn" id="btnLogin" style="width:100%;">${isSignup? 'إرسال طلب الحساب' : 'تسجيل الدخول'}</button>
      <div class="note" style="margin-top:14px; text-align:center;">
        ${isSignup
          ? `عندك حساب بالفعل؟ <a href="#" id="toLogin" style="color:var(--teal); font-weight:700;">تسجيل الدخول</a>`
          : `مفيش حساب لمنشأتك؟ <a href="#" id="toSignup" style="color:var(--teal); font-weight:700;">اطلب حساب جديد</a>`}
      </div>
    </div>`;
  document.getElementById('btnLogin').addEventListener('click', isSignup? doSignup : doLogin);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter'){ isSignup? doSignup() : doLogin(); } });
  const toS = document.getElementById('toSignup'); if(toS) toS.addEventListener('click', (e)=>{ e.preventDefault(); authMode='signup'; renderLogin(); });
  const toL = document.getElementById('toLogin'); if(toL) toL.addEventListener('click', (e)=>{ e.preventDefault(); authMode='login'; renderLogin(); });
}

function renderPending(msg){
  const gate = gateEl();
  gate.innerHTML = `
    <div class="card" style="max-width:380px; width:100%; text-align:center;">
      <div style="font-size:32px;">⏳</div>
      <h1 style="font-size:16px; color:var(--navy-deep); margin:10px 0 6px 0;">بانتظار موافقة المشرف</h1>
      <p style="font-size:13px; color:var(--muted);">${msg || 'تم استلام طلب حسابك، هيتفعّل بعد ما المشرف يوافق عليه. جرب تسجّل الدخول تاني بعد شوية.'}</p>
      <button class="btn ghost small" id="btnPendingLogout" style="margin-top:10px;">تسجيل الخروج</button>
    </div>`;
  document.getElementById('btnPendingLogout').addEventListener('click', doLogout);
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!email || !pass){ renderLogin('من فضلك أدخل البريد وكلمة المرور'); return; }
  try{
    await window.__authFns.signInWithEmailAndPassword(window.__auth, email, pass);
  }catch(e){
    renderLogin('بيانات الدخول غير صحيحة');
  }
}

async function doSignup(){
  const hospital = document.getElementById('suHospital').value.trim();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!hospital || !email || !pass){ renderLogin('من فضلك املأ كل الخانات'); return; }
  if(pass.length < 6){ renderLogin('كلمة المرور لازم تكون 6 حروف على الأقل'); return; }
  try{
    const cred = await window.__authFns.createUserWithEmailAndPassword(window.__auth, email, pass);
    const { doc, setDoc } = window.__firestoreFns;
    await setDoc(doc(window.__firestoreDb, 'users', cred.user.uid), {
      email, hospitalName: hospital, approved:false, role:'user', createdAt: new Date().toISOString()
    });
    // signOut immediately so they land on the pending screen via the normal auth flow
    renderPending('تم إنشاء الحساب بنجاح. بانتظار موافقة المشرف على "' + hospital + '".');
  }catch(e){
    renderLogin(e.code==='auth/email-already-in-use' ? 'البريد الإلكتروني ده مستخدم بالفعل' : 'تعذّر إنشاء الحساب');
  }
}

async function doLogout(){
  await window.__authFns.signOut(window.__auth);
}

function showApp(){
  const gate = document.getElementById('authGate');
  if(gate) gate.remove();
  document.querySelector('.app').style.display = 'flex';
}

async function fetchMyProfile(uid){
  try{
    const { doc, getDoc } = window.__firestoreFns;
    const snap = await getDoc(doc(window.__firestoreDb, 'users', uid));
    return snap.exists() ? snap.data() : null;
  }catch(e){ return null; }
}

async function loadAdminUsersList(){
  try{
    const { collection, getDocs } = window.__firestoreFns;
    const snap = await getDocs(collection(window.__firestoreDb, 'users'));
    adminUsersList = [];
    snap.forEach(d=> adminUsersList.push({ uid:d.id, ...d.data() }));
    adminUsersList.sort((a,b)=> (a.hospitalName||'').localeCompare(b.hospitalName||''));
  }catch(e){ adminUsersList = []; }
}

window.addEventListener('auth-state-changed', async (e)=>{
  currentUser = e.detail.user;
  if(!currentUser){ myProfile=null; isAdminUser=false; targetUid=null; renderLogin(); return; }

  isAdminUser = currentUser.email === ADMIN_EMAIL;
  targetUid = currentUser.uid;

  if(isAdminUser){
    await loadAdminUsersList();
    showApp();
    if(window.__firestoreDb){ initFirebase(); } else { window.addEventListener('firebase-ready', initFirebase, {once:true}); }
    return;
  }

  myProfile = await fetchMyProfile(currentUser.uid);
  if(!myProfile){ renderPending('لم يتم العثور على بيانات حسابك. تواصل مع المشرف.'); return; }
  if(!myProfile.approved){ renderPending(); return; }
  showApp();
  if(window.__firestoreDb){ initFirebase(); } else { window.addEventListener('firebase-ready', initFirebase, {once:true}); }
});

(function init(){
  renderAll(); // pre-render with defaults; auth gate controls visibility
  renderLogin();
})();
</script>
